AWSTemplateFormatVersion: '2010-09-09'
Description: Infraestructura Completa Soluciones Futuro - Red, Servidor y Almacenamiento.

Resources:
  VPCProyecto:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: VPC-Financiera

  SubredPublica:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPCProyecto
      CidrBlock: 10.0.1.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Subred-Publica-Financiera

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPCProyecto
      InternetGatewayId: !Ref InternetGateway

  ServidorFinanciero:
    Type: AWS::EC2::Instance
    Properties:
      # Asegúrate de usar la AMI correcta de tu región (Amazon Linux 2023)
      ImageId: ami-0bb841ac39861251c 
      InstanceType: t2.micro
      SubnetId: !Ref SubredPublica
      # --- AQUÍ EMPIEZA LA MAGIA DEL USER DATA ---
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # 1. Actualizar el sistema
          dnf update -y
          # 2. Instalar Docker
          dnf install -y docker
          # 3. Arrancar el servicio de Docker
          systemctl start docker
          systemctl enable docker
          # 4. Darle permisos al usuario por defecto (opcional)
          usermod -a -G docker ec2-user
          # 5. Mensaje de confirmación en el log
          echo "La infraestructura financiera está lista" > /var/www/html/status.txt
      Tags:
        - Key: Name
          Value: Servidor-Financiero-Automatizado

  BucketS3Proyecto:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "evidencias-roberto-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled

  TablaLogsBackup:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: BackupLogsFinancieros_Final
      AttributeDefinitions:
        - AttributeName: log_id
          AttributeType: S
      KeySchema:
        - AttributeName: log_id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5