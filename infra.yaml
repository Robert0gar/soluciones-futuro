AWSTemplateFormatVersion: '2010-09-09'
Description: Infraestructura base para Soluciones Futuro - Roberto y Ricardo

Resources:
  BucketS3Proyecto:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "evidencias-roberto-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled

  TablaLogsBackup:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: BackupLogsFinancieros
      AttributeDefinitions:
        - AttributeName: log_id
          AttributeType: S
      KeySchema:
        - AttributeName: log_id
          KeyType: HASH
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5